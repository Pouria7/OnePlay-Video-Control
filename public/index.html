<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnePlay - Video Control</title>
  <meta name="description" content="Reliable playback controls for any web video, even when the site's own player gets in the way.">
  <link rel="icon" href="/icons/icon-48.png">
  <style>
    :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --accent: #2f6fed; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #111; --accent: #6ea0ff; } }
    body { margin: 0; font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 720px; margin: 0 auto; padding: 64px 20px 80px; text-align: center; }
    img.logo { width: 96px; height: 96px; }
    h1 { font-size: 2rem; margin: 16px 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    nav { margin-top: 40px; display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<main>
  <img class="logo" src="/icons/icon-128.png" alt="OnePlay - Video Control logo" width="96" height="96">
  <h1>OnePlay - Video Control</h1>
  <p>Reliable playback controls for any web video, even when the site's own player gets in the way.</p>
  <nav>
    <a href="https://chromewebstore.google.com/detail/universal-video-controls">Chrome Web Store</a>
    <a href="mailto:oneabout@outlook.com">Support: oneabout@outlook.com</a>
    <a href="/privacy">Privacy Policy</a>
  </nav>
</main>
</body>
</html>
